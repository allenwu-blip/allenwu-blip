<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-label="Sparkle: a 3D toothbrushing buddy for kids. Try the live demo."><title>Sparkle: a 3D toothbrushing buddy for kids. Try the live demo.</title><style>@font-face{font-family:monob;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:display;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:body;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:mono;src:url(data:font/woff2;base64,) format('woff2');}@keyframes tw{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}.tw{animation:tw 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes ring{0%{opacity:.6;transform:scale(1)}100%{opacity:0;transform:scale(1.25)}}.ring{animation:ring 2.2s ease-out infinite;transform-box:fill-box;transform-origin:center}</style><defs><linearGradient id="rim1" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox"><stop offset="0" stop-color="#f472b6" stop-opacity=".75"/><stop offset=".35" stop-color="#1d2742"/><stop offset=".65" stop-color="#1d2742"/><stop offset="1" stop-color="#22d3ee" stop-opacity=".6"/><animateTransform attributeName="gradientTransform" type="rotate" values="0 .5 .5;360 .5 .5" dur="14s" repeatCount="indefinite"/></linearGradient><linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a1020"/><stop offset="1" stop-color="#05070f"/></linearGradient><linearGradient id="pg3" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f9a8d4"/><stop offset="1" stop-color="#c4b5fd"/></linearGradient><linearGradient id="btn4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f472b6"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs><rect x="1" y="1" width="1278" height="298" rx="22" fill="url(#bg2)" stroke="url(#rim1)" stroke-width="1.6"/><text x="48.0" y="64.0" font-family="monob" font-size="16" fill="#fbbf24" letter-spacing="2">FEATURED · TECH JAM 2026</text><text x="46.0" y="128.0" font-family="display" font-size="64" fill="url(#pg3)" >Sparkle</text><g transform="translate(292 82) scale(1.1)"><path class="tw" style="animation-delay:0.0s" d="M0 -10 C1.2 -3 3 -1.2 10 0 C3 1.2 1.2 3 0 10 C-1.2 3 -3 1.2 -10 0 C-3 -1.2 -1.2 -3 0 -10Z" fill="#fbbf24"/></g><g transform="translate(316 108) scale(0.7)"><path class="tw" style="animation-delay:-0.8s" d="M0 -10 C1.2 -3 3 -1.2 10 0 C3 1.2 1.2 3 0 10 C-1.2 3 -3 1.2 -10 0 C-3 -1.2 -1.2 -3 0 -10Z" fill="#f9a8d4"/></g><g transform="translate(302 130) scale(0.5)"><path class="tw" style="animation-delay:-1.6s" d="M0 -10 C1.2 -3 3 -1.2 10 0 C3 1.2 1.2 3 0 10 C-1.2 3 -3 1.2 -10 0 C-3 -1.2 -1.2 -3 0 -10Z" fill="#c4b5fd"/></g><text x="48.0" y="172.0" font-family="body" font-size="22" fill="#e8edf8" >A fairy who brushes along with kids: five zones on live 3D teeth, sugar bugs that pop,</text><text x="48.0" y="204.0" font-family="body" font-size="22" fill="#e8edf8" >a letter from Sparkle after every brush, and a parent view behind a PIN.</text><rect x="48" y="236" width="224.0" height="30" rx="15" fill="#22d3ee" fill-opacity=".08" stroke="#22d3ee" stroke-opacity=".45"/><text x="61.0" y="256.0" font-family="mono" font-size="15" fill="#22d3ee" >React + TypeScript PWA</text><rect x="282.0" y="236" width="179.0" height="30" rx="15" fill="#8b5cf6" fill-opacity=".08" stroke="#8b5cf6" stroke-opacity=".45"/><text x="295.0" y="256.0" font-family="mono" font-size="15" fill="#8b5cf6" >three.js 3D teeth</text><rect x="471.0" y="236" width="269.0" height="30" rx="15" fill="#f472b6" fill-opacity=".08" stroke="#f472b6" stroke-opacity=".45"/><text x="484.0" y="256.0" font-family="mono" font-size="15" fill="#f472b6" >ElevenLabs voice + lip-sync</text><rect x="750.0" y="236" width="161.0" height="30" rx="15" fill="#fbbf24" fill-opacity=".08" stroke="#fbbf24" stroke-opacity=".45"/><text x="763.0" y="256.0" font-family="mono" font-size="15" fill="#fbbf2